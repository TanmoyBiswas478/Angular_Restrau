<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Join the Elite</h2>
      <p>Create your premium YUMMMY 😋 account</p>
    </div>

    @if (errorMessage) {
      <div class="error-box">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onRegister()">

      <!-- Full Name -->
      <div class="form-group">
        <label>Full Name *</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="newName"
          (keydown)="blockNumbers($event)"
          (input)="onNameInput($event)"
          placeholder="e.g. Tanmoy Biswas"
        />
        <small
          *ngIf="nameError"
          class="error-msg"
          style="color: #e11d48; font-size: 0.8rem; font-weight: 600; margin-top: 4px; display: block;"
        >
          {{ nameError }}
        </small>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label>Email Address *</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          placeholder="name@example.com"
        />
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label>Phone Number *</label>
        <div class="phone-input-group">
          <select class="country-code-select" name="countryCode" [(ngModel)]="selectedCountryCode">
            <option value="+91">🇮🇳 +91 (IN)</option>
            <option value="+1">🇺🇸 +1 (US)</option>
            <option value="+44">🇬🇧 +44 (UK)</option>
            <option value="+971">🇦🇪 +971 (UAE)</option>
          </select>
          <input
            type="tel"
            name="phoneNumber"
            class="phone-number-input"
            maxlength="10"
            [(ngModel)]="newPhone"
            (keydown)="blockLetters($event)"
            (input)="validatePhoneInput($event)"
            placeholder="9988776655"
          />
        </div>
        <small
          *ngIf="phoneError"
          class="error-msg"
          style="color: #e11d48; font-size: 0.8rem; font-weight: 600; margin-top: 4px; display: block;"
        >
          {{ phoneError }}
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password *</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          required
          placeholder="Create a secure password"
        />
      </div>

      <!-- Account Type Readonly -->
      <div class="form-group">
        <label>Account Type</label>
        <input
          type="text"
          name="role"
          [ngModel]="user.role || 'Customer'"
          readonly
          class="readonly-input"
          placeholder="Customer"
          value="Customer"
        />
      </div>

      <button type="submit" class="btn auth-btn">Create Account</button>
    </form>

    <p class="switch-link">Already a member? <a routerLink="/login">Sign In here</a></p>
  </div>
</div>
