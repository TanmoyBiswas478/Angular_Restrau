<div class="admin-container">
  <div class="admin-header">
    <h2>⚙️ System Access Control</h2>
    <p>Manage role-based visibility across the platform.</p>
  </div>

  <div class="settings-card">
    @for (item of menuItems; track item.path) {
      <div class="menu-item-row">
        <div class="menu-item-info">
          <h3>{{ item.label }}</h3>
          <span class="path-badge">{{ item.path }}</span>
        </div>
        
        <div class="role-checkboxes">
          @for (role of availableRoles; track role) {
            <label class="custom-checkbox">
              <input type="checkbox" 
                     [checked]="item.roles.includes(role)" 
                     (change)="toggleRole(item, role)"
                     [disabled]="role === 'admin' && item.path === '/home'"> 
              <span class="checkmark"></span>
              {{ role | titlecase }}
            </label>
          }
        </div>
      </div>
    }

    <div class="action-footer">
      <button class="save-btn" (click)="saveSettings()">Save Configuration</button>
    </div>
  </div>
</div>
