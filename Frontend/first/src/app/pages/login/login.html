<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your premium account</p>
    </div>

    @if (errorMessage) {
      <div class="error-box">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn auth-btn">Sign In</button>
    </form>

    <p class="switch-link">New to YUMMMY 😋? <a routerLink="/register">Create an Account</a></p>
  </div>
</div>
