<div class="profile-container">
  <div class="profile-header">
    <h2>👤 Customer Profile</h2>
    <p>Manage your account credentials, photo, and preferences.</p>
  </div>

  <div *ngIf="isLoading" class="loading-box">
    <p>🔄 Loading your profile information...</p>
  </div>

  <div *ngIf="!isLoading" class="profile-grid">
    <!-- Left Column: Photo Upload Card -->
    <div class="card photo-card">
      <h3>Passport Photograph</h3>

      <div class="avatar-preview-box">
        <img [src]="previewAvatar || 'assets/default-avatar.png'" alt="User Avatar" class="avatar-img" />
      </div>

      <div class="upload-controls">
        <label for="photoInput" class="upload-btn"> 📷 Upload New Photo </label>
        <input id="photoInput" type="file" accept="image/png, image/jpeg, image/jpg" (change)="onFileSelected($event)"
          hidden />
        <span class="file-note">⚠️ Must be Passport Size & Under 10240KB</span>
      </div>
    </div>

    <!-- Right Column: Info & Password Cards -->
    <div class="right-column">
      <!-- Basic Details & Email Change -->
      <div class="card">
        <h3>📝 Account Details</h3>
        <form (ngSubmit)="saveProfileInfo()">
          <!-- 👇 NAYA ADD KIYA: Membership Status (Read-Only) -->
          <!-- 🛑 PURANA WALA HATA KAR YEH DALO -->
          <div class="form-group">
            <label>⭐ Membership Tier</label>
            <input type="text" [(ngModel)]="profile.membership" name="membership" readonly
              style="background-color: #f1f5f9; color: #ed0c53 !important; font-weight: 800; border: 1px dashed #cbd5e1; text-transform: uppercase;" />
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="profile.name" name="name" required placeholder="Enter name" />
          </div>

          <div class="form-group">
            <label>Email Address (Account ID)</label>
            <input type="email" [(ngModel)]="profile.email" name="email" required placeholder="Enter email" />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" [(ngModel)]="profile.phone" name="phone" placeholder="Enter phone" />
          </div>

          <!-- 👇 NAYA ADD KIYA: Delivery Address Field -->
          <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" [(ngModel)]="profile.address" name="address"
              placeholder="Enter your full delivery address" />
          </div>

          <button type="submit" class="submit-btn" [disabled]="isSavingInfo">
            {{ isSavingInfo ? 'Saving...' : '💾 Update Details' }}
          </button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="card">
        <h3>🔒 Security & Password</h3>
        <form (ngSubmit)="updatePassword()">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" [(ngModel)]="passwordData.current_password" name="current_password"
              placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" [(ngModel)]="passwordData.new_password" name="new_password" placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" [(ngModel)]="passwordData.confirm_password" name="confirm_password"
              placeholder="••••••••" />
          </div>

          <button type="submit" class="submit-btn secondary" [disabled]="isChangingPass">
            {{ isChangingPass ? 'Updating...' : '🔑 Change Password' }}
          </button>
        </form>
      </div>

      <!-- Danger Zone: Delete Account -->
      <div class="card danger-card">
        <h3>🚨 Danger Zone</h3>
        <p>Permanently delete your profile and order history.</p>
        <button type="button" class="delete-btn" (click)="confirmDeleteAccount()">
          🗑️ Delete My Account
        </button>
      </div>
    </div>
  </div>
</div>
