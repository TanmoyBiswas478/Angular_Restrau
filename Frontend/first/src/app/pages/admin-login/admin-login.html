<div class="auth-container">
  <div class="auth-card admin-card">
    <div class="auth-header">
      <h2>👑 Super Admin Portal</h2>
      <p>Secure System Access Management</p>
    </div>

    <form (ngSubmit)="onAdminLogin()">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" required placeholder="admin@yummy.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn auth-btn admin-btn">Login to Admin Control</button>
    </form>
  </div>
</div>
